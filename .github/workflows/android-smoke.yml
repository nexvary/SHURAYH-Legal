name: Android 15 Smoke & Screenshot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 15 device tests and capture RTL home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.nexvary.shurayh
            adb shell am start -W -n com.nexvary.shurayh/.MainActivity
            sleep 4
            adb shell pidof com.nexvary.shurayh
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/shurayh-home-rtl.png
            test -s screenshots/shurayh-home-rtl.png

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: SHURAYH-Android15-RTL-screenshot
          path: screenshots/shurayh-home-rtl.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHURAYH-Android15-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 30
