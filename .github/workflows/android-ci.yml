name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved UI fixes to app source
        if: github.event_name == 'push'
        run: |
          FILE="app/src/main/java/com/nexvary/shurayh/ShurayhApp.kt"
          sed -i 's/Color(0xFFD4AF37)/Color(0xFFC9A44A)/g' "$FILE"
          sed -i 's/Color(0xFFB99432)/Color(0xFF9A7630)/g' "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/nexvary/shurayh/ShurayhApp.kt")
          s = p.read_text()

